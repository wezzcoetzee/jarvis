<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Arc reactor. Edit this, then run scripts/icon.sh to rebuild AppIcon.icns.
       The body follows Apple's icon grid: 824 of 1024, with room for the shadow. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#06202c"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#bff4ff"/>
      <stop offset="1" stop-color="#2ad4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7b0"/>
      <stop offset="1" stop-color="#3a444b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="9.75" y="9.75" width="80.5" height="80.5" rx="18.1" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="10" y="10" width="80" height="80" rx="17.85" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width=".5"/>
  <g transform="translate(50 50) scale(.894) translate(-50 -50)">
    <circle cx="50" cy="50" r="33" fill="none" stroke="url(#metal)" stroke-width="4"/>
    <circle cx="50" cy="50" r="31" fill="#02141c"/>
    <g filter="url(#glow)">
      <circle cx="50" cy="50" r="25" fill="none" stroke="#38d9ff" stroke-width="7" stroke-dasharray="12.2 3.5" stroke-opacity=".85"/>
      <circle cx="50" cy="50" r="17" fill="none" stroke="#9aa7b0" stroke-width="1"/>
      <path d="M50 63 L38.7 43.5 L61.3 43.5 Z" fill="#38d9ff" fill-opacity=".25" stroke="#dff8ff" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <circle cx="50" cy="50" r="9" fill="url(#core)"/>
    <circle cx="50" cy="50" r="3.5" fill="#fff"/>
  </g>
</svg>

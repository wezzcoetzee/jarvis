name: CI

on:
  pull_request:
  push:
    branches: [main]

# The shared macos-ci.yml only knows SwiftPM and XcodeGen apps at the repo
# root. Jarvis is a Bun CLI plus a Swift Dock in dock/, so it runs its own
# checks. macOS because the Dock only builds there and the CLI targets it.
jobs:
  test:
    runs-on: macos-26
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: swift build --package-path dock
